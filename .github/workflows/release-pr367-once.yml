name: Temporary PR367 edge release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnose downloads read-only, or run the separately approved release
        type: choice
        options: [diagnose, release]
        default: diagnose
        required: true
      confirmation:
        description: DIAGNOSE_PR367_LAYOUT_ONLY or DEPLOY_PR367_WITH_VERIFIED_GIT_ROLLBACK; must match mode
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: escocia-pr367-edge-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'sforero94/Escociaos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed release control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned syntax proof without management credentials
        run: npm install --prefix "$RUNNER_TEMP/pr367-proof" --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Check synthetic release controls
        env:
          PROOF_TYPESCRIPT: ${{ runner.temp }}/pr367-proof/node_modules/typescript/lib/typescript.js
        run: node --test scripts/release-pr367.checks.mjs scripts/release-pr367-capture.checks.mjs
      - name: Checkout fixed deployed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 634580480c72b27c7ccd2d8c006af520d0ca1058
          path: release-source
          persist-credentials: false
      - name: Checkout fixed Git rollback source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e5d2291202901848c45e42a2ffddae1a4cdf249e
          path: rollback-source
          persist-credentials: false
      - name: Install official pinned CLI without management credentials
        env:
          CLI_CACHE: ${{ runner.temp }}/pr367-npm-cache
        run: npx --cache "$CLI_CACHE" --yes --package supabase@2.122.0 -- supabase --version
      - name: Run selected diagnostic or separately approved release
        env:
          CLI_CACHE: ${{ runner.temp }}/pr367-npm-cache
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROOF_TYPESCRIPT: ${{ runner.temp }}/pr367-proof/node_modules/typescript/lib/typescript.js
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/release-pr367.mjs
