name: Temporary PR371 edge release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnose v281 first; release only after separate approval of observed evidence
        type: choice
        options: [diagnose, release]
        default: diagnose
        required: true
      confirmation:
        description: DIAGNOSE_PR371_V281_ONLY or DEPLOY_PR371_WITH_REVIEWED_V281_ROLLBACK
        type: string
        required: true
      reviewed_diagnostic_run_id:
        description: Release only; successful first-attempt diagnostic run on identical controls, reviewed by owner
        type: string
        default: ''
      reviewed_diagnostic_sha256:
        description: Release only; SHA256 of exact observed diagnostic receipt, reviewed by owner
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # Same group as the existing PR367 job: never run both backend jobs together.
  group: escocia-pr367-edge-release
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: read
      actions: read
    if: github.repository == 'sforero94/Escociaos' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed release controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned proof without management credentials
        run: npm install --prefix "$RUNNER_TEMP/pr371-proof" --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Test synthetic controls without credentials
        env:
          PROOF_TYPESCRIPT: ${{ runner.temp }}/pr371-proof/node_modules/typescript/lib/typescript.js
        run: node --test scripts/release-pr367.checks.mjs scripts/release-pr367-capture.checks.mjs scripts/release-pr371.checks.mjs
      - name: Checkout fixed runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e7a5545bc8d87ad0502caf009d0201cae67fc772
          path: release-source
          persist-credentials: false
      - name: Checkout fixed v281 rollback source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 634580480c72b27c7ccd2d8c006af520d0ca1058
          path: rollback-source
          persist-credentials: false
      - name: Install official pinned CLI without management credentials
        env:
          CLI_CACHE: ${{ runner.temp }}/pr371-npm-cache
        run: npx --cache "$CLI_CACHE" --yes --package supabase@2.122.0 -- supabase --version
      - name: Verify selected mode and authenticated diagnostic evidence before management access
        env:
          DIAGNOSTIC_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          REVIEWED_DIAGNOSTIC_RUN_ID: ${{ inputs.reviewed_diagnostic_run_id }}
          REVIEWED_DIAGNOSTIC_SHA256: ${{ inputs.reviewed_diagnostic_sha256 }}
        run: node scripts/release-pr371.mjs --verify-diagnostic
      - name: Run authorized diagnostic or separately approved release
        env:
          CLI_CACHE: ${{ runner.temp }}/pr371-npm-cache
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROOF_TYPESCRIPT: ${{ runner.temp }}/pr371-proof/node_modules/typescript/lib/typescript.js
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          REVIEWED_DIAGNOSTIC_RUN_ID: ${{ inputs.reviewed_diagnostic_run_id }}
          REVIEWED_DIAGNOSTIC_SHA256: ${{ inputs.reviewed_diagnostic_sha256 }}
        run: node scripts/release-pr371.mjs
      - name: Remove non-secret approval receipt
        if: always()
        run: rm -f "$RUNNER_TEMP/pr371-approved.json"
